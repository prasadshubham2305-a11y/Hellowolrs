name: TWILIGHT-1 Tests

on:
  push:
    branches:
      - twilight-1-dev
    paths:
      - 'twilight1/**'
      - '.github/workflows/twilight-test.yml'
  pull_request:
    branches:
      - twilight-1-dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test BODY prototype
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight1_body.c \
            twilight1/test_twilight.c \
            -o test_body
          ./test_body

      - name: Test macro framework
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight1_macro.c \
            twilight1/test_twilight1_macro.c \
            -o test_macros
          ./test_macros

      - name: Test Engine Core
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight1_body.c \
            twilight1/twilight1_edge.c \
            twilight1/twilight1_growl.c \
            twilight1/twilight1_macro.c \
            twilight1/twilight1_engine.c \
            twilight1/test_twilight1_engine.c \
            -o test_engine
          ./test_engine

      - name: Test GROWL
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight1_growl.c \
            twilight1/test_twilight1_growl.c \
            -o test_growl
          ./test_growl
                - name: Test MOTION
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight1_motion.c \
            twilight1/test_twilight1_motion.c \
            -o test_motion
          ./test_motion

