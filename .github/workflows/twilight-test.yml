name: TWILIGHT-1 Tests

on:
  push:
    branches:
      - twilight-1-dev
    paths:
      - 'twilight1/**'
      - '.github/workflows/twilight-test.yml'
  pull_request:
    branches:
      - twilight-1-dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test BODY prototype
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight_body.c \
            twilight1/test_twilight.c \
            -o test_body
          ./test_body

      - name: Test macro framework
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            twilight1/twilight1_macro.c \
            twilight1/test_twilight1_macro.c \
            -o test_macros
          ./test_macros
